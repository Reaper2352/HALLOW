<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALLOW — Night Cycle</title>
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="manifest" href="./site.json" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0b'/%3E%3Cpath d='M32 8 L52 54 H12 Z' fill='none' stroke='%239aa3ad' stroke-width='2'/%3E%3Ccircle cx='32' cy='28' r='3' fill='%23c9d2db'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <header class="top">
      <div class="mark">
        <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
          <path d="M32 6 L54 56 H10 Z" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="32" cy="26" r="2.6" fill="currentColor" />
        </svg>
        <span>HALLOW</span>
      </div>
      <nav class="nav" id="nav">
        <button data-view="cycle" class="on">CYCLE</button>
        <button data-view="ops">OPS</button>
        <button data-view="notes">NOTES</button>
        <button data-view="hold">HOLD</button>
        <button data-view="house">HOUSE</button>
        <button data-view="board">BOARD</button>
        <button data-view="wire" id="wireBtn">WIRE</button>
      </nav>
      <div class="status"><span class="dot"></span><span id="clock">—</span></div>
    </header>
    <main id="stage"></main>
    <footer>
      <span id="footLeft">HALLOW // night cycle</span>
      <span id="footRight">keys 1–7</span>
    </footer>
    <div class="toast" id="toast" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
