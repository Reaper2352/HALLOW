<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALLOW — Night Cycle</title>
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="manifest" href="./site.json" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./extra.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <header class="top">
      <div class="mark"><span>HALLOW</span></div>
      <nav class="nav" id="nav"></nav>
      <div class="status"><span class="dot"></span><span id="clock">—</span></div>
    </header>
    <main id="stage"></main>
    <footer>
      <span id="footLeft">HALLOW // night cycle</span>
      <span id="footRight">keys 1–9</span>
    </footer>
    <div class="toast" id="toast" hidden></div>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
