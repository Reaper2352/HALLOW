<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALLOW — Choose your operative</title>
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="HALLOW. Dark rooms. Steel edges. One operative. Choose." />
    <meta property="og:title" content="HALLOW" />
    <meta property="og:description" content="Choose your operative." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0b'/%3E%3Cpath d='M32 8 L52 54 H12 Z' fill='none' stroke='%239aa3ad' stroke-width='2'/%3E%3Ccircle cx='32' cy='28' r='3' fill='%23c9d2db'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./site.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <header class="top">
      <div class="mark">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <path d="M32 6 L54 56 H10 Z" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="32" cy="26" r="2.6" fill="currentColor" />
        </svg>
        <span>HALLOW</span>
      </div>
      <div class="status">
        <span class="dot"></span>
        NIGHT CYCLE · 00:33 BST
      </div>
    </header>
    <main>
      <section class="hero">
        <p class="kicker">// clearance: black</p>
        <h1>Choose your<br /><em>operative</em>.</h1>
        <p class="lede">
          Four names on the board. One locked file that should not exist.
          The house is empty. The night is long. Pick who walks it.
        </p>
      </section>
      <section class="board" id="board" aria-label="Operative select"></section>
      <section class="dossier" id="dossier" hidden>
        <div class="dossier-inner">
          <button class="ghost" id="back" type="button">← return to board</button>
          <div class="dossier-grid">
            <div class="portrait-wrap">
              <div class="portrait" id="portrait"></div>
              <div class="portrait-meta" id="portraitMeta"></div>
            </div>
            <div class="file">
              <p class="file-id" id="fileId"></p>
              <h2 id="fileName"></h2>
              <p class="callsign" id="callsign"></p>
              <dl id="stats"></dl>
              <p class="brief" id="brief"></p>
              <button class="commit" id="commit" type="button">DEPLOY</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <span>HALLOW // steel & ash</span>
      <span id="clock"></span>
    </footer>
    <div class="toast" id="toast" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
