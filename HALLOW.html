<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HALLOW</title><style>:root{--bg:#0a0a0b;--steel:#9aa3ad;--line:rgba(154,163,173,.2);--text:#e8eaed;--pink:#d4a0b0}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100%}body{padding:16px 16px 72px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.mark{letter-spacing:.28em;font-size:12px;color:var(--steel)}#clock{font-family:Consolas,monospace;font-size:11px;color:var(--steel)}nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}nav button,.btn{background:#141518;color:var(--text);border:1px solid var(--line);padding:8px 10px;font-family:Consolas,monospace;font-size:10px;letter-spacing:.12em;cursor:pointer;text-transform:uppercase}nav button.on{border-color:var(--pink);color:var(--pink)}h1{font-weight:500;font-size:34px;margin:0 0 10px}em{font-style:italic;color:var(--pink)}p,.meta{color:var(--steel);font-family:Consolas,monospace;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.panel{border:1px solid var(--line);padding:14px;background:#111214}.stat{font-size:28px}.stat span{display:block;font-size:11px;color:var(--steel)}input,textarea{width:100%;background:#0e0f11;color:var(--text);border:1px solid var(--line);padding:10px;font-family:Consolas,monospace}textarea{min-height:180px}ul{list-style:none;padding:0}li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-family:Consolas,monospace;font-size:13px}.hold{font-size:56px;text-align:center;font-family:Consolas,monospace}#hgrid{display:grid;grid-template-columns:repeat(12,18px);gap:2px}.cell{width:18px;height:18px;background:#1a1b1e}.cell.wall{background:#3a3d44}.cell.you{background:#e8eaed}.cell.patrol{background:#b44}.cell.intel{background:var(--pink)}.toast{position:fixed;bottom:16px;left:16px;background:#1a1b1e;border:1px solid var(--pink);color:var(--pink);padding:10px 12px;font-family:Consolas,monospace;font-size:11px}.hidden{display:none}.rowline{display:block;width:100%;text-align:left;margin-bottom:6px}.dim{opacity:.4}</style></head><body><header><div class="mark">HALLOW</div><div id="clock">--:--:--</div></header><nav id="nav"></nav><main id="stage"></main><div id="toast" class="toast hidden"></div><script>const KEY="hallow.onefile.v1";const NAV=["CYCLE","OPS","NOTES","HOLD","HOUSE","WIRE"];const BRIEFS=["Check in. Sit still. Extract one map. That is the night.","The streak only moves if you come back tomorrow.","HOLD before HOUSE. Then close the lid."];const WIRES=[{id:"w1",need:1,title:"CHECK-IN",body:"Received. Come back tomorrow or the streak dies."},{id:"w2",need:2,title:"HOLD",body:"Sixty seconds first. Then the game."},{id:"w3",need:3,title:"SEAL",body:"Three nights. The last name was never locked."}];function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function load(){try{return Object.assign({streak:0,last:null,ops:[],notes:"",holds:0,wins:0,wires:[]},JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){return {streak:0,last:null,ops:[],notes:"",holds:0,wins:0,wires:[]};}}const S=load();function save(){localStorage.setItem(KEY,JSON.stringify(S));}function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.i);toast.i=setTimeout(function(){t.classList.add("hidden");},2200);}let view="CYCLE",holdT=null,holdLeft=0,game=null;function checkIn(){const t=today();if(S.last===t){toast("already logged tonight");return;}const y=new Date();y.setDate(y.getDate()-1);const ymd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");S.streak=S.last===ymd?S.streak+1:1;S.last=t;WIRES.forEach(function(w){if(S.streak>=w.need&&S.wires.indexOf(w.id)<0)S.wires.push(w.id);});save();toast("streak "+S.streak);render();}const MAP={w:12,h:8,walls:["3,3","4,3","5,3","6,3","7,3","5,1","5,2","8,5","2,6"],patrols:[{x:6,y:1,dx:1,dy:0},{x:10,y:4,dx:0,dy:1}]};function blocked(x,y){if(x<0||y<0||x>=MAP.w||y>=MAP.h)return true;return MAP.walls.indexOf(x+","+y)>=0;}function newGame(){const free=[];for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++)if(!blocked(x,y)&&!(x===0&&y===0))free.push([x,y]);const intel=[];for(let i=0;i<4;i++){const k=Math.floor(Math.random()*free.length);intel.push(free.splice(k,1)[0]);}if(game&&game.tick)clearInterval(game.tick);game={you:[0,0],intel,patrols:MAP.patrols.map(function(p){return {x:p.x,y:p.y,dx:p.dx,dy:p.dy};}),got:0,alive:true,won:false,tick:null};game.tick=setInterval(step,520);}function step(){if(!game||!game.alive||game.won)return;game.patrols.forEach(function(p){let nx=p.x+p.dx,ny=p.y+p.dy;if(blocked(nx,ny)){p.dx*=-1;p.dy*=-1;nx=p.x+p.dx;ny=p.y+p.dy;}if(!blocked(nx,ny)){p.x=nx;p.y=ny;}});if(hit()){game.alive=false;toast("seen");}paintHouse();}function hit(){return game.patrols.some(function(p){return p.x===game.you[0]&&p.y===game.you[1];});}function move(dx,dy){if(!game||!game.alive||game.won||view!=="HOUSE")return;const nx=game.you[0]+dx,ny=game.you[1]+dy;if(blocked(nx,ny))return;game.you=[nx,ny];if(hit()){game.alive=false;toast("seen");paintHouse();return;}const i=game.intel.findIndex(function(p){return p[0]===nx&&p[1]===ny;});if(i>=0){game.intel.splice(i,1);game.got++;}if(game.got>=4){game.won=true;S.wins++;save();toast("EXTRACT");}paintHouse();}function paintHouse(){const g=document.getElementById("hgrid"),info=document.getElementById("hinfo");if(!g||!game)return;let html="";for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){let c="cell";if(blocked(x,y))c+=" wall";if(game.intel.some(function(p){return p[0]===x&&p[1]===y;}))c+=" intel";if(game.patrols.some(function(p){return p.x===x&&p.y===y;}))c+=" patrol";if(game.you[0]===x&&game.you[1]===y)c+=" you";html+="<div class=\""+c+"\"></div>";}g.innerHTML=html;if(info)info.textContent=game.won?"EXTRACT.":!game.alive?"BURNED — restart.":"White you. Red patrol. Pink "+game.got+"/4. WASD.";}function renderNav(){document.getElementById("nav").innerHTML=NAV.map(function(n){return "<button data-v=\""+n+"\" class=\""+(view===n?"on":"")+"\">"+n+"</button>";}).join("");}function render(){renderNav();const st=document.getElementById("stage");if(view==="CYCLE"){st.innerHTML="<h1>Come back<br><em>every night.</em></h1><p>"+BRIEFS[S.streak%BRIEFS.length]+"</p><div class=\"grid\"><div class=\"panel\"><div class=\"stat\">"+S.streak+"<span>streak</span></div><button class=\"btn\" id=\"cin\">CHECK IN</button></div><div class=\"panel\"><div class=\"stat\">"+S.holds+"<span>holds</span></div></div><div class=\"panel\"><div class=\"stat\">"+S.wins+"<span>extracts</span></div></div></div>";document.getElementById("cin").onclick=checkIn;}else if(view==="OPS"){st.innerHTML="<h1>Ops</h1><div style=\"display:flex;gap:8px;margin:12px 0\"><input id=\"opIn\" placeholder=\"one job\" /><button class=\"btn\" id=\"opAdd\">ADD</button></div><ul id=\"ops\"></ul>";const ul=document.getElementById("ops");ul.innerHTML=S.ops.map(function(o,i){return "<li><input type=checkbox "+(o.done?"checked":"")+" data-t=\""+i+"\"/><span>"+o.text+"</span></li>";}).join("")||"<li class=meta>empty</li>";document.getElementById("opAdd").onclick=function(){const v=document.getElementById("opIn").value.trim();if(!v)return;S.ops.unshift({text:v,done:false});save();render();};ul.onchange=function(e){if(e.target.dataset.t){S.ops[+e.target.dataset.t].done=e.target.checked;save();}};}else if(view==="NOTES"){st.innerHTML="<h1>Notes</h1><p>This computer only.</p><textarea id=\"notes\"></textarea>";const n=document.getElementById("notes");n.value=S.notes||"";n.oninput=function(){S.notes=n.value;save();};}else if(view==="HOLD"){st.innerHTML="<h1>Hold</h1><div class=\"hold\" id=\"hf\">00:00</div><p id=\"hs\" class=\"meta\">armed</p><button class=\"btn\" id=\"h1\">STILL 1:00</button> <button class=\"btn\" id=\"h5\">STILL 5:00</button> <button class=\"btn\" id=\"hab\">ABORT</button>";function paint(){const el=document.getElementById("hf");if(!el)return;el.textContent=holdT?(Math.floor(holdLeft/60)+":"+String(holdLeft%60).padStart(2,"0")):"00:00";}function start(s){clearInterval(holdT);holdLeft=s;holdT=setInterval(function(){holdLeft--;if(holdLeft<=0){clearInterval(holdT);holdT=null;holdLeft=0;S.holds++;save();toast("hold complete");}if(view==="HOLD")paint();},1000);paint();}document.getElementById("h1").onclick=function(){start(60);};document.getElementById("h5").onclick=function(){start(300);};document.getElementById("hab").onclick=function(){clearInterval(holdT);holdT=null;holdLeft=0;paint();};paint();}else if(view==="HOUSE"){if(!game)newGame();st.innerHTML="<h1>House</h1><p id=\"hinfo\"></p><div id=\"hgrid\"></div><p></p><button class=\"btn\" id=\"hr\">RESTART</button>";document.getElementById("hr").onclick=function(){newGame();paintHouse();};paintHouse();}else if(view==="WIRE"){st.innerHTML="<h1>Wire</h1>"+WIRES.map(function(w){const on=S.wires.indexOf(w.id)>=0;return on?"<div class=panel style=margin-bottom:8px><p class=meta>"+w.title+"</p><p>"+w.body+"</p></div>":"<button class=\"btn rowline dim\">LOCKED</button>";}).join("");}}document.getElementById("nav").onclick=function(e){const b=e.target.closest("button[data-v]");if(!b)return;view=b.getAttribute("data-v");render();};document.addEventListener("keydown",function(e){if(view!=="HOUSE")return;if(e.key==="ArrowUp"||e.key==="w"){e.preventDefault();move(0,-1);}if(e.key==="ArrowDown"||e.key==="s"){e.preventDefault();move(0,1);}if(e.key==="ArrowLeft"||e.key==="a"){e.preventDefault();move(-1,0);}if(e.key==="ArrowRight"||e.key==="d"){e.preventDefault();move(1,0);}});setInterval(function(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-GB",{hour12:false});},1000);render();</script></body></html>
